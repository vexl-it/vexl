name: "[Build] backend docker image"
run-name: "Build ${{ inputs.service }} on commit ${{ github.sha }} for environment ${{ inputs.env }}"

permissions:
  packages: write
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to build"
        required: true
        type: choice
        options:
          - prod
          - stage
          - dev
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - all
          - btc-exchange-rate-service
          - chat-service
          - contact-service
          - content-service
          - feedback-service
          - location-service
          - metrics-service
          - notification-service
          - offer-service
          - user-service
          - backoffice-app
          - dashboard-app
          - web-app
  workflow_call:
    inputs:
      env:
        description: "Environment to build"
        required: true
        type: string
      service:
        description: "Service to build (or all)"
        required: true
        type: string

jobs:
  services:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select services to build
        id: select
        env:
          SERVICE: ${{ inputs.service }}
        # Single source of truth for backend images. Entries without a
        # dockerfile build the root Dockerfile with APP/SERVICE_DISPLAY_NAME
        # build args; apps/* entries build their own Dockerfile.
        run: |
          matrix=$(jq -c --arg s "$SERVICE" '[.[] | select($s == "all" or .service == $s)]' <<'EOF'
          [
            {"service": "btc-exchange-rate-service", "image": "bitcoin-rate-service", "display": "BTC exchange rate service"},
            {"service": "chat-service", "image": "chat-ms", "display": "Chat service"},
            {"service": "contact-service", "image": "contact-ms", "display": "Contact service"},
            {"service": "content-service", "image": "content-service", "display": "Content service"},
            {"service": "feedback-service", "image": "feedback-service", "display": "Feedback service"},
            {"service": "location-service", "image": "location-service", "display": "Location service"},
            {"service": "metrics-service", "image": "metrics-service", "display": "Metrics service"},
            {"service": "notification-service", "image": "notification-service", "display": "Notification service"},
            {"service": "offer-service", "image": "offer2-ms", "display": "Offer service"},
            {"service": "user-service", "image": "user-ms", "display": "User service"},
            {"service": "backoffice-app", "image": "backoffice-app", "dockerfile": "./apps/backoffice-app/Dockerfile"},
            {"service": "dashboard-app", "image": "dashboard-app", "dockerfile": "./apps/dashboard-app/Dockerfile"},
            {"service": "web-app", "image": "web-app", "dockerfile": "./apps/web-app/Dockerfile"}
          ]
          EOF
          )
          if [ "$(printf '%s' "$matrix" | jq length)" -eq 0 ]; then
            echo "::error::unknown service: $SERVICE"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: ${{ matrix.service }}
    needs: services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.services.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: arn:aws:iam::570620554963:role/github_actions_ecr_vexl
          role-session-name: GithubActionsCloudInfrastructure
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ matrix.dockerfile || './Dockerfile' }}
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ghcr.io/vexl-it/${{ matrix.image }}:latest
            ghcr.io/vexl-it/${{ matrix.image }}:${{ inputs.env }}-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }}:${{ inputs.env }}-${{ github.sha }}
          build-args: |
            SERVICE_VERSION=${{ github.sha }}
            ENVIRONMENT=${{ inputs.env }}
            ${{ matrix.display && format('APP={0}', matrix.service) || '' }}
            ${{ matrix.display && format('SERVICE_DISPLAY_NAME={0}', matrix.display) || '' }}
