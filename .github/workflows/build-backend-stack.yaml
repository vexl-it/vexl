name: "[Build] backend stack"
run-name: "Build backend stack on commit ${{ github.sha }} for environment ${{ inputs.env }}"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to build (prod|stage|dev)"
        required: true
        type: choice
        options:
          - prod
          - stage
          - dev

permissions:
  packages: write
  contents: write
  id-token: write

jobs:
  btc-exchange-rate-service:
    uses: ./.github/workflows/build-btc-exchange-rate-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  user-service:
    uses: ./.github/workflows/build-user-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  offer-service:
    uses: ./.github/workflows/build-offer-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  notification-service:
    uses: ./.github/workflows/build-notification-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  metrics-service:
    uses: ./.github/workflows/build-metrics-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  location-service:
    uses: ./.github/workflows/build-location-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  chat-service:
    uses: ./.github/workflows/build-chat-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  feedback-service:
    uses: ./.github/workflows/build-feedback-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  content-service:
    uses: ./.github/workflows/build-content-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  contact-service:
    uses: ./.github/workflows/build-contact-service.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  web-app:
    uses: ./.github/workflows/build-web-app.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  backoffice-app:
    uses: ./.github/workflows/build-backoffice-app.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  dashboard-app:
    uses: ./.github/workflows/build-dashboard-app.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}

  sentry-release:
    runs-on: ubuntu-latest
    needs:
      - btc-exchange-rate-service
      - user-service
      - offer-service
      - notification-service
      - metrics-service
      - location-service
      - chat-service
      - feedback-service
      - content-service
      - contact-service
      - backoffice-app
      - dashboard-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release for all backend projects
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: vexl
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set — skipping Sentry release creation; events will still carry the release sha, but without commit metadata."
            exit 0
          fi
          PROJECTS="-p user-service -p contact-service -p offer-service -p chat-service -p notification-service -p content-service -p feedback-service -p location-service -p btc-exchange-rate-service -p metrics-service -p dashboard-app -p backoffice-app"
          VERSION="${{ github.sha }}"
          SENTRY_ENV="${{ inputs.env == 'prod' && 'production' || inputs.env }}"
          npx --yes @sentry/cli@2 releases new $PROJECTS "$VERSION"
          npx --yes @sentry/cli@2 releases set-commits --auto "$VERSION" \
            || echo "::warning::set-commits failed — check that the GitHub repo is linked in Sentry (Settings -> Integrations -> GitHub)"
          npx --yes @sentry/cli@2 releases finalize $PROJECTS "$VERSION"
          npx --yes @sentry/cli@2 releases deploys "$VERSION" new -e "$SENTRY_ENV" || true
