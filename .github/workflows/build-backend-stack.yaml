name: "[Build] backend stack"
run-name: "Build backend stack on commit ${{ github.sha }} for environment ${{ inputs.env }}"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to build (prod|stage|dev)"
        required: true
        type: choice
        options:
          - prod
          - stage
          - dev
      create_infra_pr:
        description: "Open a release PR in the infrastructure repo (prod/stage only)"
        required: false
        type: boolean
        default: true

permissions:
  packages: write
  contents: read
  id-token: write

jobs:
  build-images:
    uses: ./.github/workflows/build-backend-image.yaml
    secrets: inherit
    with:
      env: ${{ inputs.env }}
      service: all

  infra-release-pr:
    name: Open infrastructure release PR
    runs-on: ubuntu-latest
    if: ${{ inputs.create_infra_pr && inputs.env != 'dev' }}
    needs:
      - build-images
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: vexl-it/${{ secrets.infrastructure_repository }}
          token: ${{ secrets.infrastructure_repository_token }}

      # The manifests already hold the right ECR repo per service, so updating
      # is just rewriting the image tag in every <env>/manifests/*/deployment.yaml
      # — no per-service list to keep in sync with this repo.
      - name: Update manifest image tags
        env:
          DEPLOY_ENV: ${{ inputs.env }}
          NEW_TAG: ${{ inputs.env }}-${{ github.sha }}
        run: |
          shopt -s nullglob
          manifests=("$DEPLOY_ENV"/manifests/*/deployment.yaml)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::no deployment manifests found for env $DEPLOY_ENV"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            yq -i '.spec.template.spec.containers[0].image |= sub(":[^:/]+$"; ":" + strenv(NEW_TAG))' "$manifest"
            echo "updated $manifest"
          done

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.infrastructure_repository_token }}
          DEPLOY_ENV: ${{ inputs.env }}
        run: |
          if git diff --quiet; then
            echo "::notice::manifests already point to $GITHUB_SHA — nothing to release"
            exit 0
          fi
          env_name="$DEPLOY_ENV"
          [ "$env_name" = "prod" ] && env_name="production"
          short_sha="${GITHUB_SHA::7}"
          branch="release/${DEPLOY_ENV}-${short_sha}"
          title="Release backends ${short_sha} to ${env_name}"
          body="$(printf 'Updates %s manifests to backend images built from vexl-it/vexl-next@%s.\n\nOpened by [Build] backend stack: %s/%s/actions/runs/%s' \
            "$env_name" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git commit -am "$title"
          git push -f origin "$branch"
          if ! gh pr view "$branch" --json url -q .url 2>/dev/null; then
            gh pr create --base master --head "$branch" --title "$title" --body "$body"
          fi

  sentry-release:
    runs-on: ubuntu-latest
    needs:
      - build-images
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Install only the root workspace deps so sentry-cli resolves through the
      # reviewed lockfile instead of being fetched ad-hoc by npx.
      - name: Install sentry-cli
        run: pnpm install --frozen-lockfile --filter vexl-next

      - name: Create Sentry release for all backend projects
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: vexl
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set — skipping Sentry release creation; events will still carry the release sha, but without commit metadata."
            exit 0
          fi
          PROJECTS="-p user-service -p contact-service -p offer-service -p chat-service -p notification-service -p content-service -p feedback-service -p location-service -p btc-exchange-rate-service -p metrics-service -p dashboard-app -p backoffice-app"
          VERSION="${{ github.sha }}"
          SENTRY_ENV="${{ inputs.env == 'prod' && 'production' || inputs.env }}"
          pnpm exec sentry-cli releases new $PROJECTS "$VERSION"
          pnpm exec sentry-cli releases set-commits --auto "$VERSION" \
            || echo "::warning::set-commits failed — check that the GitHub repo is linked in Sentry (Settings -> Integrations -> GitHub)"
          pnpm exec sentry-cli releases finalize $PROJECTS "$VERSION"
          pnpm exec sentry-cli releases deploys "$VERSION" new -e "$SENTRY_ENV" || true
