name: "[Build] geocoding-refresh docker image"
run-name: "Run on commit ${{github.sha}}"

permissions:
  packages: write
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The refresh image is environment-agnostic — DB credentials come at
      # runtime via --env-file — so unlike the service builds there is no env
      # input and no ECR push (it never runs in-cluster). arm64 is included so
      # it runs natively on Apple Silicon operator machines.
      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./tools/location-db-updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=geocoding-refresh
          cache-to: type=gha,mode=max,scope=geocoding-refresh
          tags: |
            ghcr.io/vexl-it/geocoding-refresh:latest
            ghcr.io/vexl-it/geocoding-refresh:${{ github.sha }}
