name: "[Release] vexl-foundation"
run-name: "Release vexl-foundation on commit ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      create_infra_pr:
        description: "Open a release PR in the infrastructure repo"
        required: false
        type: boolean
        default: true

concurrency:
  group: release-vexl-foundation
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: vexl-foundation
  IMAGE_TAG: prod-${{ github.sha }}

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Verify release branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be run from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: arn:aws:iam::570620554963:role/github_actions_ecr_vexl
          role-session-name: GithubActionsVexlFoundation
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./apps/vexl-foundation/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          cache-from: type=gha,scope=vexl-foundation
          cache-to: type=gha,mode=max,scope=vexl-foundation
          tags: |
            ghcr.io/vexl-it/${{ env.IMAGE_NAME }}:latest
            ghcr.io/vexl-it/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            SERVICE_VERSION=${{ github.sha }}
            ENVIRONMENT=prod

  infra-release-pr:
    name: Open infrastructure release PR
    runs-on: ubuntu-latest
    if: ${{ inputs.create_infra_pr }}
    needs:
      - build-image
    permissions:
      contents: read
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: vexl-it/${{ secrets.INFRASTRUCTURE_REPOSITORY }}
          token: ${{ secrets.INFRASTRUCTURE_REPOSITORY_TOKEN }}

      - name: Update manifest image tag
        env:
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
        run: |
          manifest="prod/manifests/websites/vexl-foundation/deployment.yaml"
          if [ ! -f "$manifest" ]; then
            echo "::error::deployment manifest not found: $manifest"
            exit 1
          fi
          current_image="$(yq -r '.spec.template.spec.containers[0].image' "$manifest")"
          if [ "$current_image" = "PLACEHOLDER-vexl-foundation-image" ]; then
            yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE_REF)' "$manifest"
            echo "replaced placeholder in $manifest with $IMAGE_REF"
          else
            case "$current_image" in
              *:*) ;;
              *)
                echo "::error::unexpected image without tag in $manifest: $current_image"
                exit 1
                ;;
            esac
            yq -i '.spec.template.spec.containers[0].image |= sub(":[^:/]+$"; ":" + strenv(IMAGE_TAG))' "$manifest"
            echo "updated $manifest to $IMAGE_TAG"
          fi

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_REPOSITORY_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "::notice::manifest already points to $GITHUB_SHA — nothing to release"
            exit 0
          fi
          short_sha="${GITHUB_SHA::7}"
          branch="release/vexl-foundation-${short_sha}"
          title="Release vexl-foundation ${short_sha} to production"
          body="$(printf 'Updates vexl-foundation to the image built from %s@%s.\n\nOpened by [Release] vexl-foundation: %s/%s/actions/runs/%s' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git commit -am "$title"
          git push -f origin "$branch"
          if ! gh pr view "$branch" --json url -q .url 2>/dev/null; then
            gh pr create --base master --head "$branch" --title "$title" --body "$body"
          fi
