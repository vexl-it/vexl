# Local dev INFRA + OBSERVABILITY only. The 10 backend services and the 3 web
# apps run as HOST node processes supervised by tooling/dev/dev-backend.ts.
#
# Ports default to dev.config.ts values and are overridable via .env.local
# (the supervisor passes the resolved values through as ${VAR}).
services:
  postgres:
    image: postgres:13
    container_name: vexl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # One database per service (spec §5.1). Init runs only on an empty volume.
      - ./tooling/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Standalone Postgres for the geocoding DB — deliberately separate from the
  # vexl service databases so geocoding traffic and OSM ingests never share
  # resources with user data (mirrors the prod topology).
  geocoding-postgres:
    build:
      context: ./tooling/dev/geocoding-postgres
    image: vexl-geocoding-postgres:dev
    container_name: vexl-geocoding-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: geocoding
    ports:
      - "${GEOCODING_POSTGRES_PORT:-5433}:5432"
    volumes:
      - geocoding_postgres_data:/var/lib/postgresql/data
      # Czechia dataset dump, restored automatically on an EMPTY volume only.
      - ./tooling/dev/geocoding-postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: during initdb the temp server only listens on the Unix
      # socket, so a socket pg_isready would pass while the dump restore is
      # still running and `up --wait` would return too early.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d geocoding",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:6
    container_name: vexl-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  minio:
    # MinIO stopped publishing images. Silo is its maintained community fork:
    # same server, env, console and on-disk format.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: vexl-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vexl}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vexl-local-secret}
    ports:
      # Phones upload/download chat images straight to MinIO, so the API must
      # be reachable on the LAN, not just on localhost.
      - "0.0.0.0:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    container_name: vexl-minio-init
    # One-shot bucket setup. Kept behind a profile so `up --wait` does not include
    # it (--wait treats an exited container, even code 0, as a failure). The
    # supervisor runs it explicitly via `docker compose run --rm minio-init`.
    profiles: ["init"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vexl}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vexl-local-secret}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-vexl-resources}
      S3_CHAT_IMAGES_BUCKET_NAME: ${S3_CHAT_IMAGES_BUCKET_NAME:-vexl-chat-images}
      CHAT_IMAGES_EXPIRE_DAYS: ${CHAT_IMAGES_EXPIRE_DAYS:-90}
    # Chat images are publicly readable by id (ciphertext only) but not
    # listable. `mc ilm import` replaces the whole lifecycle config, so
    # re-running init never duplicates the expiry rule.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing local/"$${S3_BUCKET_NAME}"
        mc anonymous set download local/"$${S3_BUCKET_NAME}"
        mc mb --ignore-existing local/"$${S3_CHAT_IMAGES_BUCKET_NAME}"
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::'"$${S3_CHAT_IMAGES_BUCKET_NAME}"'/*"]}]}' > /tmp/chat-images-policy.json
        mc anonymous set-json /tmp/chat-images-policy.json local/"$${S3_CHAT_IMAGES_BUCKET_NAME}"
        echo '{"Rules":[{"ID":"expire-chat-images","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":'"$${CHAT_IMAGES_EXPIRE_DAYS}"'}}]}' | mc ilm import local/"$${S3_CHAT_IMAGES_BUCKET_NAME}"

  loki:
    image: grafana/loki:3.6.0
    container_name: vexl-loki
    user: "0"
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./tooling/dev/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.7.2
    container_name: vexl-tempo
    user: "0"
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
    volumes:
      - ./tooling/dev/observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:12.4.0
    container_name: vexl-grafana
    depends_on:
      - loki
      - tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    volumes:
      - ./tooling/dev/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
    driver: local
  geocoding_postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local
